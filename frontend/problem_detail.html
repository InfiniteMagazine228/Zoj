<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Problem Detail - Mini OJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/problems.html">Mini OJ</a>
            <div class="d-flex">
                <a href="/submissions.html" class="btn btn-outline-light me-2">My Submissions</a>
                <button onclick="logout()" class="btn btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <!-- Đề bài -->
            <div class="col-md-5">
                <h3 id="pTitle">Loading...</h3>
                <hr>
                <div id="pStatement" class="bg-white p-3 rounded border"></div>
                
                <!-- Upload testcase (Giáo viên) -->
                <div id="teacherUpload" class="mt-4 p-3 bg-white rounded border" style="display:none;">
                    <h5>Upload Test Cases (.in và .out xen kẽ)</h5>
                    <input type="file" id="tcFiles" class="form-control mb-2" multiple required>
                    <button id="uploadBtn" class="btn btn-warning btn-sm">Upload</button>
                </div>
            </div>
            
            <!-- Editor -->
            <div class="col-md-7">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <select id="langSelect" class="form-select w-25">
                        <option value="python">Python 3.12</option>
                        <option value="cpp">C++20</option>
                    </select>
                    <div>
                        <input type="file" id="fileUpload" accept=".py,.cpp" style="display:none;">
                        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-upload"></i> Upload</button>
                        <button class="btn btn-success btn-sm" onclick="submitCode()"><i class="fas fa-paper-plane"></i> Submit</button>
                    </div>
                </div>
                <div id="editor" class="editor-container"></div>
                <div id="resultDiv" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        checkAuth();
        let editor;
        let currentProblemId = new URLSearchParams(window.location.search).get('id');

        // Khởi tạo Monaco
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                theme: 'vs-dark',
                language: 'python',
                automaticLayout: true
            });
            
            document.getElementById('langSelect').addEventListener('change', (e) => {
                let lang = e.target.value;
                monaco.editor.setModelLanguage(editor.getModel(), lang === 'python' ? 'python' : 'cpp');
            });
        });

        // Load đề bài
        async function loadProblem() {
            const res = await fetchAPI(`/api/problems/${currentProblemId}`);
            const data = await res.json();
            document.getElementById('pTitle').innerText = data.title;
            document.getElementById('pStatement').innerText = data.statement;
            
            if(getRole() === 'teacher') {
                document.getElementById('teacherUpload').style.display = 'block';
            }
        }
        loadProblem();

        // Upload file code
        document.getElementById('fileUpload').addEventListener('change', (e) => {
            let file = e.target.files[0];
            let reader = new FileReader();
            reader.onload = (ev) => editor.setValue(ev.target.result);
            reader.readAsText(file);
        });

        // Submit code
        async function submitCode() {
            const code = editor.getValue();
            const lang = document.getElementById('langSelect').value;
            
            document.getElementById('resultDiv').innerHTML = '<div class="alert alert-info">Đang chấm...</div>';

            const formData = new FormData();
            formData.append('problem_id', currentProblemId);
            formData.append('language', lang);
            formData.append('source_code', code);

            const res = await fetchAPI('/api/submissions/', { method: 'POST', body: formData });
            const data = await res.json();

            // Polling kết quả
            setTimeout(() => checkResult(data.id), 2000);
        }

        async function checkResult(subId) {
            const res = await fetchAPI(`/api/submissions/${subId}`);
            const data = await res.json();
            
            if(data.status === 'Pending' || data.status === 'Judging') {
                setTimeout(() => checkResult(subId), 1500);
                return;
            }
            
            let cls = 'alert-info';
            if(data.status === 'Accepted') cls = 'alert-success';
            else if(data.status === 'Compile Error') cls = 'alert-warning';
            else cls = 'alert-danger';
            
            document.getElementById('resultDiv').innerHTML = `
                <div class="alert ${cls}">
                    <strong>Trạng thái:</strong> ${data.status} <br>
                    <strong>Điểm:</strong> ${data.score}/100
                </div>
            `;
        }

        // Upload Testcase
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const files = document.getElementById('tcFiles').files;
            if(files.length % 2 !== 0) { alert('File input và output phải đi thành cặp!'); return; }
            
            const formData = new FormData();
            for(let f of files) formData.append('files', f);
            
            const res = await fetchAPI(`/api/problems/${currentProblemId}/testcases`, { method: 'POST', body: formData });
            if(res.ok) alert('Upload test case thành công!');
        });
    </script>
</body>
</html>
