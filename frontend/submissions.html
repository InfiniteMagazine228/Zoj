<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>My Submissions - Mini OJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/problems.html">Mini OJ</a>
            <div class="d-flex">
                <a href="/problems.html" class="btn btn-outline-light me-2">Problems</a>
                <button onclick="logout()" class="btn btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Lịch sử nộp bài</h2>
        <table class="table table-bordered mt-3 bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Problem ID</th>
                    <th>Ngôn ngữ</th>
                    <th>Trạng thái</th>
                    <th>Điểm</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody id="subList"></tbody>
        </table>
    </div>
    <script src="/static/js/auth.js"></script>
    <script>
        checkAuth();
        async function loadSubs() {
            const res = await fetchAPI('/api/submissions/my');
            const data = await res.json();
            const tbody = document.getElementById('subList');
            tbody.innerHTML = data.map(s => {
                let cls = '';
                if(s.status === 'Accepted') cls = 'status-accepted';
                else if(s.status === 'Pending' || s.status === 'Judging') cls = 'status-pending';
                else cls = 'status-wrong';
                
                return `
                    <tr>
                        <td>${s.id}</td>
                        <td><a href="/problem_detail.html?id=${s.problem_id}">${s.problem_id}</a></td>
                        <td>${s.language}</td>
                        <td class="${cls}">${s.status}</td>
                        <td>${s.score}</td>
                        <td>${new Date(s.created_at).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
        }
        loadSubs();
    </script>
</body>
</html>
