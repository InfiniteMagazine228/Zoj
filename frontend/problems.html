<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Problems - Mini OJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/problems.html">Mini OJ</a>
            <div class="d-flex">
                <a href="/submissions.html" class="btn btn-outline-light me-2">My Submissions</a>
                <button onclick="logout()" class="btn btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Danh sách bài tập</h2>
        <table class="table table-bordered mt-3 bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên bài</th>
                    <th>Giới hạn thời gian</th>
                    <th>Giới hạn bộ nhớ</th>
                </tr>
            </thead>
            <tbody id="probList"></tbody>
        </table>
        
        <!-- Chỉ Giáo viên mới thấy -->
        <div id="teacherPanel" class="mt-5 p-4 bg-white rounded shadow" style="display:none;">
            <h4>Tạo bài tập mới (Giáo viên)</h4>
            <form id="createProbForm">
                <input type="text" id="title" class="form-control mb-2" placeholder="Tên bài" required>
                <textarea id="statement" class="form-control mb-2" placeholder="Đề bài" required></textarea>
                <div class="row">
                    <div class="col"><input type="number" id="time_limit" class="form-control mb-2" placeholder="Time (s)" value="2"></div>
                    <div class="col"><input type="number" id="memory_limit" class="form-control mb-2" placeholder="Memory (MB)" value="256"></div>
                </div>
                <button type="submit" class="btn btn-success">Tạo bài</button>
            </form>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script>
        checkAuth();
        if(getRole() === 'teacher') {
            document.getElementById('teacherPanel').style.display = 'block';
        }

        async function loadProblems() {
            const res = await fetchAPI('/api/problems/');
            const data = await res.json();
            const tbody = document.getElementById('probList');
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><a href="/problem_detail.html?id=${p.id}">${p.title}</a></td>
                    <td>${p.time_limit}s</td>
                    <td>${p.memory_limit}MB</td>
                </tr>
            `).join('');
        }
        loadProblems();

        document.getElementById('createProbForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('statement', document.getElementById('statement').value);
            formData.append('time_limit', document.getElementById('time_limit').value);
            formData.append('memory_limit', document.getElementById('memory_limit').value);
            
            const res = await fetchAPI('/api/problems/', { method: 'POST', body: formData });
            if(res.ok) {
                alert('Tạo bài thành công! Hãy upload test case ở trang chi tiết.');
                loadProblems();
            }
        });
    </script>
</body>
</html>
